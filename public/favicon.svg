<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background rounded square -->
  <rect width="32" height="32" rx="8" fill="#0f172a"/>

  <!-- Clock face -->
  <circle cx="16" cy="16" r="11" fill="none" stroke="#6366f1" stroke-width="2"/>

  <!-- Clock hands forming a "T" shape with flair -->
  <!-- Hour hand pointing to ~10 -->
  <line x1="16" y1="16" x2="9" y2="10" stroke="#a78bfa" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Minute hand pointing to ~2 -->
  <line x1="16" y1="16" x2="22" y2="9" stroke="#f472b6" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Center dot -->
  <circle cx="16" cy="16" r="2" fill="#f472b6"/>

  <!-- Pulsing accent dots at 12, 3, 6, 9 -->
  <circle cx="16" cy="6" r="1.2" fill="#6366f1"/>
  <circle cx="26" cy="16" r="1.2" fill="#6366f1"/>
  <circle cx="16" cy="26" r="1.2" fill="#6366f1"/>
  <circle cx="6" cy="16" r="1.2" fill="#6366f1"/>

  <!-- Lightning bolt accent -->
  <path d="M19 5 L14 14 L18 14 L13 22 L21 11 L17 11 Z" fill="#fbbf24" opacity="0.9"/>
</svg>
