<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="#1e1b4b"/>
  <!-- Clock ring -->
  <circle cx="16" cy="17" r="10" fill="none" stroke="#818cf8" stroke-width="2.5"/>
  <!-- Hour hand -->
  <line x1="16" y1="17" x2="11" y2="11" stroke="#c4b5fd" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Minute hand -->
  <line x1="16" y1="17" x2="22" y2="13" stroke="#f472b6" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Center -->
  <circle cx="16" cy="17" r="2" fill="#f472b6"/>
  <!-- Lightning bolt -->
  <polygon points="18,4 13,13 17,13 12,22 22,10 18,10" fill="#fbbf24"/>
</svg>
